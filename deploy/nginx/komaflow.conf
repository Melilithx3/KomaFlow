# /etc/nginx/sites-available/komaflow.conf  (docs/03-server-ops.md §4)
# Put this line into the http { } block once (e.g. /etc/nginx/conf.d/komaflow-limit.conf):
#   limit_req_zone $binary_remote_addr zone=komaflow_login:10m rate=10r/m;

server {
  listen 80;
  server_name komaflow.tlinmo.site;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name komaflow.tlinmo.site;

  ssl_certificate     /etc/letsencrypt/live/komaflow.tlinmo.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/komaflow.tlinmo.site/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 256m;

  location = /api/v1/auth/login {
    limit_req zone=komaflow_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/komaflow-proxy.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/komaflow-proxy.conf;
    proxy_request_buffering off;   # streaming uploads
    proxy_buffering off;           # streaming zip downloads
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
