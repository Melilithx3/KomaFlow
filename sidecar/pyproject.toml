[project]
name = "komaflow-sidecar"
version = "0.1.0"
description = "Local model service for komaflow desktop: page layout + OCR on crops (PyTorch, ROCm/CPU)"
requires-python = ">=3.12"
# Runtime deps of the control process are stdlib + pillow; model stages run in an env built from locks/.
dependencies = ["pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
komaflow-sidecar = "komaflow_sidecar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["komaflow_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the real models and a GPU (run with -m gpu)"]
addopts = "-m 'not gpu'"
